<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131c"><title>Azumofuyuki Chat</title><link rel="stylesheet" href="/style.css"></head>
<body><main id="app">
<section id="authView" class="auth-shell"><div class="brand-mark">A</div><p class="eyebrow">AZUMOFUYUKI COMMUNITY</p><h1>Azumofuyuki <span>Chat</span></h1><p class="muted intro">Minecraftの仲間と、ここでつながろう。</p><div class="auth-card"><div class="tabs"><button class="tab active" data-tab="login">ログイン</button><button class="tab" data-tab="apply">参加申請</button></div>
<form id="loginForm"><label>Minecraftユーザー名<input name="username" autocomplete="username" minlength="3" maxlength="16" required></label><label>パスワード<input name="password" type="password" autocomplete="current-password" required></label><button class="primary wide">ログイン</button></form>
<form id="applyForm" hidden><label>Minecraftユーザー名<input name="username" minlength="3" maxlength="16" pattern="[A-Za-z0-9_]{3,16}" required></label><label>パスワード<input name="password" type="password" minlength="10" maxlength="128" required></label><button class="primary wide">参加を申請する</button><p class="hint">申請後、Minecraftサーバー内で確認コードを発言してください。</p></form><p id="authNotice" class="notice" role="status"></p></div><p class="footnote">参加は管理者の本人確認・承認制です。</p></section>
<section id="chatView" class="chat-shell" hidden>
<aside class="sidebar"><div class="side-brand"><div class="mini-mark">A</div><div><b>Azumofuyuki</b><small>COMMUNITY CHAT</small></div></div>
<div class="side-section"><div class="side-label">TEXT CHANNELS</div><nav id="channelList"></nav></div>
<div class="side-section"><div class="side-label side-label-row">DIRECT MESSAGES <button id="newDm" title="DMを開始">＋</button></div><nav id="dmList"></nav></div>
<div class="side-bottom"><div id="profile"></div><button id="logout" class="ghost">ログアウト</button></div></aside>
<section class="chat-main"><header class="chat-header"><div><p class="eyebrow">AZUMOFUYUKI SERVER</p><h2 id="channelTitle"># general</h2><p id="channelDescription" class="muted"></p></div><div class="header-actions"><button id="pinsBtn" class="icon-btn" title="ピン留め">📌</button><button id="searchBtn" class="icon-btn" title="検索">⌕</button><button id="notificationsBtn" class="icon-btn notification-button" title="通知">♢<span id="notificationDot" hidden></span></button><span class="live-pill"><i></i> 接続中</span></div></header>
<div id="searchBar" class="search-bar" hidden><input id="searchInput" placeholder="メッセージを検索…"><button id="runSearch">検索</button><button id="closeSearch">×</button></div>
<div id="noticeBar" class="notice-bar" hidden></div><div id="messages" class="messages"><div class="empty">メッセージを読み込み中…</div></div>
<div id="replyPreview" class="reply-preview" hidden></div><div id="attachmentPreview" class="attachment-preview"></div>
<form id="messageForm" class="composer"><button type="button" id="attachButton" class="attach-btn" title="ファイル添付">＋</button><input id="fileInput" type="file" multiple hidden accept="image/png,image/jpeg,image/gif,image/webp,application/pdf,text/plain,application/zip"><textarea name="body" rows="1" maxlength="2000" placeholder="メッセージを送信…（Enterで送信）"></textarea><button class="send" aria-label="送信">➤</button></form>
</section>
<aside id="adminPanel" class="admin-panel" hidden><div class="admin-heading"><span>ADMIN CONTROL</span><b>管理パネル</b></div><h3>参加申請 <span id="pendingCount">0</span></h3><div id="applications"></div><div class="admin-divider"></div><h3>チャンネル作成</h3><form id="channelForm"><input name="name" placeholder="channel-name" required maxlength="24"><input name="description" placeholder="説明" maxlength="120"><label class="checkline"><input name="is_private" type="checkbox"> 管理者専用</label><button class="primary">作成</button></form><div class="admin-divider"></div><h3>メンバー管理</h3><div id="members"></div><div class="admin-divider"></div><h3>チャンネル権限</h3><select id="permissionChannel"></select><label class="checkline"><input id="memberCanSend" type="checkbox" checked> メンバーの送信を許可</label><label class="checkline"><input id="memberCanAttach" type="checkbox" checked> メンバーの添付を許可</label><button id="savePermissions" class="primary wide">権限を保存</button></aside>
</section></main><div id="toast" class="toast"></div>
<div id="modal" class="modal" hidden><div class="modal-card"><button id="modalClose" class="modal-close">×</button><h3 id="modalTitle"></h3><div id="modalContent"></div></div></div>
<script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
