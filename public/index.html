<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131c"><title>Azumofuyuki Chat</title><link rel="stylesheet" href="./style.css"></head>
<body><section id="authView" class="auth"><div class="mark">A</div><p class="eyebrow">AZUMOFUYUKI COMMUNITY</p><h1>Azumofuyuki <span>Chat</span></h1><p class="muted">Minecraftの仲間と、ここでつながろう。</p><div class="auth-card"><div class="tabs"><button class="tab active" data-tab="login">ログイン</button><button class="tab" data-tab="apply">参加申請</button></div>
<form id="loginForm"><label>Minecraftユーザー名<input name="username" minlength="3" maxlength="16" pattern="[A-Za-z0-9_]{3,16}" required></label><label>パスワード<input name="password" type="password" required></label><button class="primary wide">ログイン</button></form>
<form id="applyForm" hidden><label>Minecraftユーザー名<input name="username" minlength="3" maxlength="16" pattern="[A-Za-z0-9_]{3,16}" required></label><label>パスワード（10文字以上）<input name="password" type="password" minlength="10" required></label><button class="primary wide">参加を申請する</button><p class="hint">申請後、Minecraft内で確認コードを発言してください。</p></form><p id="authNotice" class="notice"></p></div><p class="foot">参加は管理者の本人確認・承認制です。</p></section>
<section id="chatView" class="shell" hidden><aside class="sidebar"><div class="brand"><div class="mini">A</div><b>Azumofuyuki<small>COMMUNITY CHAT</small></b></div><div class="side-title">TEXT CHANNELS</div><nav id="channelList"></nav><div class="side-title">DIRECT MESSAGES <button id="newDm">＋</button></div><nav id="dmList"></nav><div class="account"><div id="profile"></div><button id="logout" class="ghost">ログアウト</button></div></aside>
<main class="main"><header><div><small>AZUMOFUYUKI SERVER</small><h2 id="channelTitle"># general</h2><p id="channelDescription"></p></div><div class="actions"><button id="pinsBtn">📌</button><button id="searchBtn">⌕</button><button id="notificationsBtn">♢<i id="notificationDot" hidden></i></button><span id="onlineCount">オンライン 0</span></div></header><div id="searchBar" hidden><input id="searchInput" placeholder="メッセージを検索"><button id="runSearch">検索</button><button id="closeSearch">×</button></div><div id="noticeBar" hidden></div><div id="messages"><div class="empty">読み込み中…</div></div><div id="replyPreview" hidden></div><div id="filePreview"></div><form id="messageForm"><button type="button" id="attach">＋</button><input id="files" type="file" multiple hidden accept="image/png,image/jpeg,image/gif,image/webp,application/pdf,text/plain,application/zip"><textarea name="body" rows="1" maxlength="2000" placeholder="メッセージを送信…（Enterで送信）"></textarea><button class="send">➤</button></form></main>
<aside id="adminPanel" hidden><h3>管理パネル</h3><h4>参加申請 <span id="pendingCount">0</span></h4><div id="applications"></div><hr><h4>チャンネル作成</h4><form id="channelForm"><input name="name" placeholder="channel-name" required maxlength="24"><input name="description" placeholder="説明"><label><input name="is_private" type="checkbox"> 管理者専用</label><button class="primary">作成</button></form><hr><h4>メンバー管理</h4><div id="members"></div></aside></section>
<div id="toast" role="status"></div><div id="modal" hidden><div class="modal-card"><button id="modalClose">×</button><h3 id="modalTitle"></h3><div id="modalContent"></div></div></div><script type="module" src="./app.mjs"></script></body></html>
