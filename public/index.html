<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131c"><title>Azumofuyuki Chat</title><link rel="stylesheet" href="/style.css"></head>
<body><main id="app">
<section id="authView" class="auth-shell"><div class="brand-mark">A</div><p class="eyebrow">AZUMOFUYUKI COMMUNITY</p><h1>Azumofuyuki <span>Chat</span></h1><p class="muted intro">Minecraftの仲間と、ここでつながろう。</p>
<div class="auth-card"><div class="tabs"><button class="tab active" data-tab="login">ログイン</button><button class="tab" data-tab="apply">参加申請</button></div>
<form id="loginForm"><label>Minecraftユーザー名<input name="username" autocomplete="username" minlength="3" maxlength="16" required placeholder="YourMinecraftName"></label><label>パスワード<input name="password" type="password" autocomplete="current-password" required></label><button class="primary wide">ログイン</button></form>
<form id="applyForm" hidden><label>Minecraftユーザー名<input name="username" minlength="3" maxlength="16" pattern="[A-Za-z0-9_]{3,16}" required placeholder="YourMinecraftName"></label><label>ログイン用パスワード<input name="password" type="password" minlength="10" maxlength="128" required placeholder="10文字以上"></label><button class="primary wide">参加を申請する</button><p class="hint">申請後、Minecraftサーバー内で確認コードを発言してください。</p></form><p id="authNotice" class="notice" role="status"></p></div><p class="footnote">参加は管理者の本人確認・承認制です。</p></section>
<section id="chatView" class="chat-shell" hidden><aside class="sidebar"><div class="side-brand"><div class="mini-mark">A</div><div><b>Azumofuyuki</b><small>COMMUNITY CHAT</small></div></div><div class="side-label">CHANNELS</div><nav id="channelList"></nav><div class="side-bottom"><div id="profile"></div><button id="logout" class="ghost">ログアウト ↗</button></div></aside>
<section class="chat-main"><header class="chat-header"><div><p class="eyebrow">AZUMOFUYUKI SERVER</p><h2 id="channelTitle"># general</h2><p id="channelDescription" class="muted"></p></div><span class="live-pill"><i></i> 接続中</span></header><div id="messages" class="messages"><div class="empty">メッセージを読み込み中…</div></div><form id="messageForm" class="composer"><textarea name="body" rows="1" maxlength="2000" placeholder="メッセージを送信…（Enterで送信 / Shift+Enterで改行）" required></textarea><button class="send" aria-label="送信">➤</button></form></section>
<aside id="adminPanel" class="admin-panel" hidden><div class="admin-heading"><span>ADMIN</span><b>管理パネル</b></div><h3>参加申請 <span id="pendingCount">0</span></h3><div id="applications"></div><div class="admin-divider"></div><h3>チャンネル作成</h3><form id="channelForm"><input name="name" placeholder="channel-name" required maxlength="24"><input name="description" placeholder="説明（任意）" maxlength="100"><button class="primary">作成</button></form><div class="admin-divider"></div><h3>メンバー</h3><div id="members"></div></aside></section>
</main><div id="toast" class="toast"></div><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
